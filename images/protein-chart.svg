<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">Protein in common Indian foods</title>
  <desc id="d">Bar chart showing grams of protein per normal serving: soya chunks 26 g, chicken breast 31 g, fish 22 g, paneer 18 g, chickpeas 15 g, eggs 12 g, milk 8 g, peanuts 7 g.</desc>
  <rect width="640" height="400" fill="#fbf6ee"/>
  <text x="24" y="38" font-family="Georgia, serif" font-size="22" fill="#2b1d14">Protein per serving (grams)</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#2b1d14">
    <text x="24" y="86">Chicken breast (100 g)</text><rect x="210" y="72" width="372" height="20" fill="#c2410c"/><text x="590" y="87">31</text>
    <text x="24" y="124">Soya chunks (50 g dry)</text><rect x="210" y="110" width="312" height="20" fill="#3f6212"/><text x="530" y="125">26</text>
    <text x="24" y="162">Fish (100 g)</text><rect x="210" y="148" width="264" height="20" fill="#c2410c"/><text x="482" y="163">22</text>
    <text x="24" y="200">Paneer (100 g)</text><rect x="210" y="186" width="216" height="20" fill="#3f6212"/><text x="434" y="201">18</text>
    <text x="24" y="238">Chickpeas, cooked (1 cup)</text><rect x="210" y="224" width="180" height="20" fill="#3f6212"/><text x="398" y="239">15</text>
    <text x="24" y="276">Eggs (2 large)</text><rect x="210" y="262" width="144" height="20" fill="#c2410c"/><text x="362" y="277">12</text>
    <text x="24" y="314">Milk (1 glass, 250 ml)</text><rect x="210" y="300" width="96" height="20" fill="#3f6212"/><text x="314" y="315">8</text>
    <text x="24" y="352">Peanuts (30 g)</text><rect x="210" y="338" width="84" height="20" fill="#3f6212"/><text x="302" y="353">7</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#5b4a3f">
    <rect x="420" y="372" width="12" height="12" fill="#3f6212"/><text x="438" y="383">Vegetarian</text>
    <rect x="520" y="372" width="12" height="12" fill="#c2410c"/><text x="538" y="383">Non-veg</text>
  </g>
</svg>
