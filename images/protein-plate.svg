<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="pt pd">
  <title id="pt">A balanced Indian plate with protein foods</title>
  <desc id="pd">Illustration of a round plate with dal, paneer cubes, boiled eggs, chickpeas and a glass of milk.</desc>
  <rect width="480" height="360" fill="#f3e3c9"/>
  <circle cx="220" cy="185" r="140" fill="#ffffff" stroke="#2b1d14" stroke-width="4"/>
  <circle cx="220" cy="185" r="112" fill="none" stroke="#e7d7bf" stroke-width="3"/>
  <!-- dal bowl -->
  <circle cx="170" cy="140" r="48" fill="#e9a23b" stroke="#2b1d14" stroke-width="3"/>
  <circle cx="160" cy="130" r="6" fill="#f7c873"/><circle cx="182" cy="150" r="5" fill="#f7c873"/>
  <!-- paneer -->
  <rect x="235" y="105" width="30" height="30" rx="4" fill="#fff8e7" stroke="#2b1d14" stroke-width="3"/>
  <rect x="272" y="120" width="30" height="30" rx="4" fill="#fff8e7" stroke="#2b1d14" stroke-width="3"/>
  <rect x="245" y="145" width="30" height="30" rx="4" fill="#fff8e7" stroke="#2b1d14" stroke-width="3"/>
  <!-- eggs -->
  <ellipse cx="180" cy="235" rx="30" ry="22" fill="#ffffff" stroke="#2b1d14" stroke-width="3"/>
  <circle cx="180" cy="235" r="10" fill="#f2b705"/>
  <ellipse cx="232" cy="250" rx="30" ry="22" fill="#ffffff" stroke="#2b1d14" stroke-width="3"/>
  <circle cx="232" cy="250" r="10" fill="#f2b705"/>
  <!-- chickpeas -->
  <g fill="#d9a35f" stroke="#2b1d14" stroke-width="2">
    <circle cx="290" cy="210" r="9"/><circle cx="306" cy="222" r="9"/><circle cx="288" cy="230" r="9"/>
    <circle cx="304" cy="242" r="9"/><circle cx="318" cy="205" r="9"/><circle cx="276" cy="248" r="9"/>
  </g>
  <!-- milk glass -->
  <path d="M392 120 L432 120 L424 250 L400 250 Z" fill="#ffffff" stroke="#2b1d14" stroke-width="4"/>
  <path d="M396 150 L428 150 L424 250 L400 250 Z" fill="#f8f4ec"/>
</svg>
